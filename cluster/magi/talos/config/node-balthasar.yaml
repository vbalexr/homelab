---
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
  - enp87s0
  - enp90s0
bondMode: 802.3ad
lacpRate: fast
miimon: 100
updelay: 200
downdelay: 200
xmitHashPolicy: layer3+4
up: true
addresses:
  - address: fd7a:2201:1ab::6/64
  - address: 10.1.0.6/22
routes:
  - gateway: fd7a:2201:1ab::1
  - gateway: 10.1.0.1
---
apiVersion: v1alpha1
kind: BondConfig
name: bond1
links:
  - enp2s0f0np0
  - enp2s0f1np1
bondMode: 802.3ad
lacpRate: fast
miimon: 100
updelay: 200
downdelay: 200
xmitHashPolicy: layer2+3
mtu: 9000
up: true
addresses:
  - address: 10.255.0.1/29
  - address: fd7a:2201:7351::1/64
---
apiVersion: v1alpha1
kind: VLANConfig
name: bond1.2
vlanID: 2
vlanMode: 802.1q
parent: bond1
mtu: 9000
up: true
---
apiVersion: v1alpha1
kind: VLANConfig
name: bond1.3
vlanID: 3
vlanMode: 802.1q
parent: bond1
mtu: 9000
up: true
---
apiVersion: v1alpha1
kind: BridgeConfig
name: br-storage
links:
  - bond1.2
mtu: 9000
up: true
addresses:
  - address: 10.255.254.1/24
---
apiVersion: v1alpha1
kind: BridgeConfig
name: br-rwx
links:
  - bond1.3
mtu: 9000
up: true
addresses:
  - address: 10.255.255.1/24
---
machine:
  kubelet:
    extraMounts:
      - destination: /var/mnt/disk0
        type: bind
        source: /var/mnt/disk0
        options:
          - bind
          - rshared
          - rw
      - destination: /var/mnt/disk1
        type: bind
        source: /var/mnt/disk1
        options:
          - bind
          - rshared
          - rw
  install:
    diskSelector:
      serial: 2N182L15CJGA
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: disk0
provisioning:
  minSize: 900GiB
  diskSelector:
    match: disk.serial == "50026B72836AD7A4"
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: disk1
provisioning:
  minSize: 900GiB
  diskSelector:
    match: disk.serial == "50026B7686F98879"
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: balthasar
auto: off
