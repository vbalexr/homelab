# Applied to all three MAGI nodes (control plane + worker). Node-specific documents are in <node>.yml.
# Address plan: network/ipam.md. Design: network/talos-bgp.md.
#
# The base config (cluster name, endpoint, secrets) comes from `talosctl gen config`; this file is
# the patch applied on top of it (see README.md).
cluster:
  etcd:
    # Only the lo identities, so etcd uses the mesh and never the uplink.
    advertisedSubnets:
      - 10.1.3.8/29
      - fd7a:2201:1ad::10/124
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 10.1.0.1
  - address: fd7a:2201:1ab::1
---
apiVersion: v1alpha1
kind: TimeSyncConfig
ntp:
  servers:
    - 10.1.0.1
---
apiVersion: v1alpha1
kind: KubeNetworkConfig
dnsDomain: cluster.local
podSubnets:
  - 10.244.0.0/16
  - fd7a:2201:1ae::/56
serviceSubnets:
  - 10.96.0.0/12
  - fd7a:2201:1af::/112
---
# Cilium will be the CNI: remove the managed Flannel.
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
# Cilium replaces kube-proxy (required for Gateway API).
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 10.1.3.8/29
    - fd7a:2201:1ad::10/124
# Control plane and worker: drop the default control-plane taint.
taints:
  node-role.kubernetes.io/control-plane:
    $patch: delete
---
# Control-plane VIP, announced from one node at a time over the uplink.
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 10.1.0.10
link: bond-up
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer-secureboot/36cd6536eaec8ba802be2d38974108359069cedba8857302f69792b26b87c010:v1.14.4
provisioning:
  wipe: true
---
# Cilium-facing side of the pod routing. veth-workload (host namespace) is where Cilium's BGP speaker
# sources its session; veth-router sits in the VRF where the Talos `workload` instance listens.
apiVersion: v1alpha1
kind: VethConfig
name: veth-workload
addresses:
  - address: "fda1:b2c3:d4e5:1::/127"
peer:
  name: veth-router
  addresses:
    - address: "fda1:b2c3:d4e5:1::1/127"
---
apiVersion: v1alpha1
kind: VRFConfig
name: vrf-workload
links:
  - veth-router
table: "88"
