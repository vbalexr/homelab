# Pod routing: every node's Cilium advertises its PodCIDRs to the Talos `workload` instance over the local
# veth (see talos/config/common.yaml); Talos imports them into the mesh. Router peering is separate.
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: pod-cidr
  labels:
    bgp.magi/advertisement: pod-cidr
spec:
  advertisements:
    - advertisementType: PodCIDR
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: talos-workload
spec:
  transport:
    peerPort: 179
    sourceInterface: veth-workload
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          bgp.magi/advertisement: pod-cidr
    - afi: ipv6
      safi: unicast
      advertisements:
        matchLabels:
          bgp.magi/advertisement: pod-cidr
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: talos-workload
spec:
  bgpInstances:
    - name: talos-workload
      localASN: 65021
      peers:
        - name: talos-workload
          peerASN: 65031
          peerAddress: "fda1:b2c3:d4e5:1::1"
          peerConfigRef:
            name: talos-workload
