# Headlamp, the Kubernetes web UI. Login is with a ServiceAccount token (see admin-user.yaml), so the UI
# only shows what that account may see.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: dashboard
spec:
  interval: 1h
  chart:
    spec:
      chart: headlamp
      version: 0.46.0
      sourceRef:
        kind: HelmRepository
        name: headlamp
  install:
    remediation:
      retries: 3
  values:
    config:
      # Served at admin.vbalex.com/dashboard (see httproute.yaml).
      baseURL: /dashboard
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
