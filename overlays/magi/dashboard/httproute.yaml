# admin.vbalex.com/dashboard -> Headlamp. Headlamp serves itself under /dashboard (config.baseURL), so the prefix is kept.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard-admin
  namespace: dashboard
spec:
  parentRefs:
    - name: admin-gateway
      namespace: admin
      sectionName: https
  hostnames:
    - admin.vbalex.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dashboard
      backendRefs:
        - name: headlamp
          port: 80
