# Tailscale subnet router: both replicas advertise the LoadBalancer pool (network/ipam.md) to the tailnet, so tailnet
# devices reach the resolvers, gateways and databases behind the routers; Tailscale fails over between the two. Runs in
# userspace networking (no TUN device, no NET_ADMIN), so the pods stay within the restricted Pod Security profile.
# State lives in a Secret per pod (tailscale-0, tailscale-1): a restarted pod is the same tailnet node, so the auth key
# is only used on the first start and its expiry does not matter afterwards.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tailscale
  namespace: tailscale
  labels:
    app: tailscale
spec:
  serviceName: tailscale
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: tailscale
  template:
    metadata:
      labels:
        app: tailscale
    spec:
      serviceAccountName: tailscale
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: tailscale
      containers:
        - name: tailscale
          image: docker.io/tailscale/tailscale
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: TS_HOSTNAME
              value: $(POD_NAME)
            - name: TS_KUBE_SECRET
              value: $(POD_NAME)
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: authkey
            - name: TS_USERSPACE
              value: "true"
            - name: TS_ROUTES
              value: 10.1.1.0/24,fd7a:2201:1ac::/64
            - name: TS_SOCKET
              value: /tmp/tailscaled.sock
            - name: TS_ENABLE_HEALTH_CHECK
              value: "true"
            - name: TS_LOCAL_ADDR_PORT
              value: 0.0.0.0:9002
          ports:
            - name: health
              containerPort: 9002
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: var-lib
              # one level up: tailscaled creates and chmods its own directory (logs, caches), which it cannot do on a mount point
              mountPath: /var/lib
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: var-lib
          emptyDir: {}
        - name: tmp
          emptyDir: {}
