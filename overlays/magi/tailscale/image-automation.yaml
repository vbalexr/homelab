---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: tailscale
  namespace: flux-system
spec:
  image: docker.io/tailscale/tailscale
  interval: 5m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: tailscale
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: tailscale
  policy:
    semver:
      range: ">=1.104.0"
