# Publishes the hostnames of the HTTPRoutes into the vbalex.com and mrakaki.com zones of Technitium, pointing at the address of the Gateway
# each route is attached to, so a new route gets its DNS record without a manual step. Updates go to the primary node over
# RFC2136, signed with the TSIG key in the `external-dns-tsig` secret. The TXT registry marks the records it owns, so it
# never touches records created by hand.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: dns
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
  install:
    remediation:
      retries: 3
  values:
    provider:
      name: rfc2136
    sources:
      - gateway-httproute
    policy: sync
    registry: txt
    txtOwnerId: magi
    domainFilters:
      - vbalex.com
      - mrakaki.com
    extraArgs:
      - --rfc2136-host=technitium-node-0.dns.svc.cluster.local
      - --rfc2136-port=53
      - --rfc2136-zone=vbalex.com
      - --rfc2136-zone=mrakaki.com
      - --rfc2136-axfr
      - --rfc2136-tsig-keyname=external-dns
      - --rfc2136-tsig-secret-alg=hmac-sha256
    env:
      - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
        valueFrom:
          secretKeyRef:
            name: external-dns-tsig
            key: tsig-secret
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
