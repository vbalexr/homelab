# TLS front for DNS-over-HTTPS and the admin console on the shared 443. Technitium serves DoH in cleartext on 127.0.0.1:80
# (only this proxy is allowed by its reverse proxy ACL) and the console on 127.0.0.1:5380; the console uses relative URLs,
# so it works under /admin/.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dns0.vbalex.com dns1.vbalex.com;

    ssl_certificate     /etc/dns-tls/tls.crt;
    ssl_certificate_key /etc/dns-tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:5380/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
