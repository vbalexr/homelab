apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secret.yaml
  - secret-tls-password.yaml
  - certificate.yaml
  - service.yaml
  - statefulset.yaml
  - httproute.yaml
configMapGenerator:
  - name: technitium-cluster-sync
    namespace: dns
    files:
      - cluster-sync.sh
images:
  - name: docker.io/technitium/dns-server
    newTag: 15.6.2 # {"$imagepolicy":"flux-system:technitium:tag"}
