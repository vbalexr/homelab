# Per-pod identity for the cluster nodes and the admin console.
apiVersion: v1
kind: Service
metadata:
  name: technitium-headless
  namespace: dns
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: technitium
  ports:
    - name: web
      port: 5380
    - name: web-tls
      port: 53443
---
apiVersion: v1
kind: Service
metadata:
  name: technitium
  namespace: dns
spec:
  selector:
    app: technitium
  ports:
    - name: web
      port: 5380
      targetPort: web
---
# One LoadBalancer per instance: clients get two fixed resolver addresses, each advertised over BGP only from the node
# running that pod (externalTrafficPolicy Local), so a resolver is reachable exactly while its pod is ready.
apiVersion: v1
kind: Service
metadata:
  name: technitium-0
  namespace: dns
  annotations:
    lbipam.cilium.io/ips: "10.1.1.30,fd7a:2201:1ac::30"
spec:
  type: LoadBalancer
  ipFamilyPolicy: PreferDualStack
  externalTrafficPolicy: Local
  selector:
    statefulset.kubernetes.io/pod-name: technitium-0
  ports:
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: dns-udp
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: dns-tcp
---
apiVersion: v1
kind: Service
metadata:
  name: technitium-1
  namespace: dns
  annotations:
    lbipam.cilium.io/ips: "10.1.1.31,fd7a:2201:1ac::31"
spec:
  type: LoadBalancer
  ipFamilyPolicy: PreferDualStack
  externalTrafficPolicy: Local
  selector:
    statefulset.kubernetes.io/pod-name: technitium-1
  ports:
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: dns-udp
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: dns-tcp
---
# Stable in-cluster address of one instance (pod IPs change on restart) that the cluster nodes register and reach each
# other on: zone transfers on 53 and the cluster API on 53443. Not exposed outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: technitium-node-0
  namespace: dns
spec:
  selector:
    statefulset.kubernetes.io/pod-name: technitium-0
  ports:
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: dns-udp
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: dns-tcp
    - name: web
      port: 5380
      targetPort: web
    - name: web-tls
      port: 53443
      targetPort: web-tls
---
# Stable in-cluster address of one instance (pod IPs change on restart) that the cluster nodes register and reach each
# other on: zone transfers on 53 and the cluster API on 53443. Not exposed outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: technitium-node-1
  namespace: dns
spec:
  selector:
    statefulset.kubernetes.io/pod-name: technitium-1
  ports:
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: dns-udp
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: dns-tcp
    - name: web
      port: 5380
      targetPort: web
    - name: web-tls
      port: 53443
      targetPort: web-tls
