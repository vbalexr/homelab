    - matches:
        - path:
            type: PathPrefix
            value: /dns1/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: technitium-node-1
          port: 5380
