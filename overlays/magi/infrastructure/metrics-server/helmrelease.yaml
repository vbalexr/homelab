# Serves the Kubernetes Metrics API (kubectl top, HPA). Prometheus already holds the same data for dashboards and alerts;
# this is only the API those clients call.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: metrics-server
      version: 3.13.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
  install:
    remediation:
      retries: 3
  values:
    args:
      # Talos kubelets serve self-signed certificates (no serving-certificate rotation), so the kubelet certificate cannot be verified.
      - --kubelet-insecure-tls
      - --kubelet-preferred-address-types=InternalIP
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
