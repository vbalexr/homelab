# Every stateful app runs one replica on an RWO volume. When a node goes down, Longhorn force-deletes the StatefulSet and
# Deployment pods on it so they reschedule and the volumes reattach on a healthy node instead of waiting for manual action.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: node-down-pod-deletion-policy
  namespace: longhorn-system
value: delete-both-statefulset-and-deployment-pod
---
# Two replicas per volume: the NAS backups (recurring job) are the safety net beyond that. Only affects new volumes.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: default-replica-count
  namespace: longhorn-system
value: '{"v1":"2","v2":"2"}'
---
# The NAS drops packets under backup load, so cap the pressure: one backup/restore at a time per node (3 nodes = at most 3
# volumes in flight cluster-wide). Backups beyond the limit wait in the queue.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: concurrent-volume-backup-restore-per-node-limit
  namespace: longhorn-system
value: "1"
---
# Worker threads per backup (default 5). Lower it to 1 if the NAS still drops packets.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: backup-concurrent-limit
  namespace: longhorn-system
value: "2"
