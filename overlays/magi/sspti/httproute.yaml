apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aa-sspti
  namespace: sspti
spec:
  parentRefs:
    - name: sspti-gateway
      sectionName: https
  hostnames:
    - auth.suspectsquadron.co.uk
  rules:
    - backendRefs:
        - name: aa-sspti-web
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aa-sspti-redirect
  namespace: sspti
spec:
  parentRefs:
    - name: sspti-gateway
      sectionName: http
  hostnames:
    - auth.suspectsquadron.co.uk
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
