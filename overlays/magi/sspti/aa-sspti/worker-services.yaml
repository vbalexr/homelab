apiVersion: apps/v1
kind: Deployment
metadata:
  name: aa-sspti-worker-services
  namespace: sspti
  labels:
    app: aa-sspti-worker-services
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aa-sspti-worker-services
  template:
    metadata:
      labels:
        app: aa-sspti-worker-services
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aa-sspti-worker-services
          image: ghcr.io/vbalexr/aa-sspti
          command: ["sh", "-c"]
          args:
            - pip install --no-cache-dir django-health-check==4.8.0 && exec celery -A myauth worker --pool=threads --concurrency=1 -Q services -n worker_services_%n
          workingDir: /home/allianceauth/myauth/
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A myauth inspect ping -d celery@worker_services_${HOSTNAME} -t 20 && python -c "import os;os.environ.setdefault('DJANGO_SETTINGS_MODULE','myauth.settings.local');import django;django.setup();from django.db import connection as c;c.ensure_connection()"
            initialDelaySeconds: 180
            periodSeconds: 60
            timeoutSeconds: 60
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: aa-sspti-env
            - secretRef:
                name: aa-sspti-secret
          securityContext:
            runAsUser: 61000
            runAsGroup: 61000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: app-config
              mountPath: /home/allianceauth/myauth/myauth/settings/local.py
              subPath: local.py
              readOnly: true
            - name: app-config
              mountPath: /home/allianceauth/myauth/myauth/celery.py
              subPath: celery.py
              readOnly: true
            - name: app-config
              mountPath: /home/allianceauth/myauth/myauth/urls.py
              subPath: urls.py
              readOnly: true
      volumes:
        - name: app-config
          configMap:
            name: aa-sspti-config
