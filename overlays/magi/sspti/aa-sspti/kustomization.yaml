apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secret.yaml
  - secret-ghcr-pull.yaml
  - configmap-env.yaml
  - service-mariadb.yaml
  - web.yaml
  - worker.yaml
  - worker-services.yaml
  - beat.yaml
  - discordbot.yaml
configMapGenerator:
  - name: aa-sspti-config
    namespace: sspti
    files:
      - config/local.py
      - config/celery.py
      - config/urls.py
  - name: aa-sspti-nginx
    namespace: sspti
    files:
      - nginx.conf
images:
  - name: ghcr.io/vbalexr/aa-sspti
    newTag: 20261113-1506 # {"$imagepolicy":"flux-system:aa-sspti:tag"}
  - name: ghcr.io/vbalexr/aa-sspti-nginx
    newTag: 20261113-1508 # {"$imagepolicy":"flux-system:aa-sspti-nginx:tag"}
