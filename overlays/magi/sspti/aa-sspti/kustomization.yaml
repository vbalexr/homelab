apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secret.yaml
  - secret-ghcr-pull.yaml
  - configmap-env.yaml
  - service-mariadb.yaml
  - web.yaml
  - worker.yaml
  - worker-services.yaml
  - beat.yaml
  - discordbot.yaml
configMapGenerator:
  - name: aa-sspti-config
    namespace: sspti
    files:
      - config/local.py
      - config/celery.py
      - config/urls.py
  - name: aa-sspti-nginx
    namespace: sspti
    files:
      - nginx.conf
