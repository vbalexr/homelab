apiVersion: apps/v1
kind: Deployment
metadata:
  name: aa-sspti-web
  namespace: sspti
  labels:
    app: aa-sspti-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aa-sspti-web
  template:
    metadata:
      labels:
        app: aa-sspti-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # static files are generated into a volume shared with nginx
        - name: collectstatic
          image: ghcr.io/vbalexr/aa-sspti:20261104-2329@sha256:1b2e0e6e164bec828335de35da9042bd1846312b2fb0f1c599c7ece6ea17a816
          command: ["sh", "-c"]
          args:
            - pip install --no-cache-dir django-health-check==4.8.0 && python manage.py collectstatic --noinput
          workingDir: /home/allianceauth/myauth/
          envFrom:
            - configMapRef:
                name: aa-sspti-env
            - secretRef:
                name: aa-sspti-secret
          securityContext:
            runAsUser: 61000
            runAsGroup: 61000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: app-config
              mountPath: /home/allianceauth/myauth/myauth/settings/local.py
              subPath: local.py
              readOnly: true
            - name: app-config
              mountPath: /home/allianceauth/myauth/myauth/celery.py
              subPath: celery.py
              readOnly: true
            - name: app-config
              mountPath: /home/allianceauth/myauth/myauth/urls.py
              subPath: urls.py
              readOnly: true
            - name: static
              mountPath: /var/www/myauth/static
      containers:
        - name: gunicorn
          image: ghcr.io/vbalexr/aa-sspti:20261104-2329@sha256:1b2e0e6e164bec828335de35da9042bd1846312b2fb0f1c599c7ece6ea17a816
          command: ["sh", "-c"]
          args:
            - pip install --no-cache-dir django-health-check==4.8.0 && exec gunicorn myauth.wsgi --bind=0.0.0.0:8000 --workers=3 --timeout=120 --max-requests=500 --max-requests-jitter=50
          workingDir: /home/allianceauth/myauth/
          envFrom:
            - configMapRef:
                name: aa-sspti-env
            - secretRef:
                name: aa-sspti-secret
          securityContext:
            runAsUser: 61000
            runAsGroup: 61000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: gunicorn
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: app-config
              mountPath: /home/allianceauth/myauth/myauth/settings/local.py
              subPath: local.py
              readOnly: true
            - name: app-config
              mountPath: /home/allianceauth/myauth/myauth/celery.py
              subPath: celery.py
              readOnly: true
            - name: app-config
              mountPath: /home/allianceauth/myauth/myauth/urls.py
              subPath: urls.py
              readOnly: true
            - name: static
              mountPath: /var/www/myauth/static
        - name: nginx
          image: ghcr.io/vbalexr/aa-sspti-nginx:20260901-2003@sha256:0faf820fd60b6f4dca54bc70d2ba7765c0076e657363cd27ae1290f8801425bf
          securityContext:
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /robots.txt
              port: http
            initialDelaySeconds: 20
          volumeMounts:
            - name: static
              mountPath: /var/www/myauth/static
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: app-config
          configMap:
            name: aa-sspti-config
        - name: nginx-conf
          configMap:
            name: aa-sspti-nginx
        - name: static
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aa-sspti-web
  namespace: sspti
spec:
  selector:
    app: aa-sspti-web
  ports:
    - name: http
      port: 80
      targetPort: http
