apiVersion: v1
kind: ConfigMap
metadata:
  name: sspti-skynet-env
data:
  ESI_BASE_URL: "https://esi.evetech.net/latest"
  ESI_DEFAULT_REGION_ID: "10000002"
  LOG_LEVEL: "INFO"
  corp.yaml: |
    name: "Suspicious Intentions"
    ticker: "SSPTI"
    alliance: "Goonswarm Federation"
    description: |
      Suspicious Intentions is a member corporation of Goonswarm Federation.
      We do a bit of everything — PvP, PvE, mining, and more — and pride ourselves on being
      a friendly, active corp where people genuinely enjoy the game together.
      We are a small but growing corp and part of one of the largest alliances in EVE Online.

      For fleet doctrines and ship reimbursement, SSPTI defers to Goonswarm Federation:
      https://goonfleet.com/index.php/forum/266-fleet-doctrines-and-reimbursement/

    role_meanings:
      Member: "Full corp member in good standing"
      "Uni Member": "University/newer member working toward full membership"
      Blue: "Blue-standings player — allied but not a corp member"
      "ice cold in the middle": "Member of the corp's highsec moon mining operation"
      "Suspicious Canon": "Titan pilot available to provide bridges for fleet members"
      "The Crumson Clause": "Member with Mercenary Den structures"
      "Suspicous Packages": "Logistics pilots — haul and move goods for the corp"
      Guest: "Temporary guest with limited server access"
      "Capital Pilots": "Pilots qualified to fly capital ships in fleet operations"
      "Abyss Sig": "Member of the Abyss special interest group"
      Fueler: "Responsible for fueling corp structures"
      "Mining Foreman": "Leads mining operations and mining fleets"
      "Recruiting Officer": "Handles member applications and recruitment interviews"
      "SRP Manager": "Manages the corp Ship Replacement Program"
      "Fleet Commander": "Authorized to form and lead fleets"
      "Consortium Manager": "Manages consortium-level activities and coordination"
      Officer: "Senior corp officer with leadership responsibilities"
      Director: "Corp director with elevated corp permissions"

    officer_roles:
      - "Consortium Manager"
      - "Fleet Commander"
      - "SRP Manager"
      - "Recruiting Officer"
      - "Mining Foreman"

    sister_corporations:
      - name: "Suspect University"
        ticker: "SSPTU"
        purpose: |
          Suspect University is the university arm of Suspicious Intentions. It is a non-wardec
          corporation designed as a safe harbor for members who prefer high-security space activities.
          It houses members who participate in highsec moon mining operations and those who run
          highsec incursions. New members or players who want a lower-risk environment often start
          here before transitioning to full SSPTI membership.
        activities:
          - "Highsec moon mining"
          - "Highsec incursions"
        notes:
          - "Non-wardec corp — members are shielded from wardec mechanics while in highsec."
          - "Members working toward full SSPTI membership may be in this corp under the 'Uni Member' role."
        policies:
          - "Stay active (pulse) — members are expected to remain present and engaged in the community."
          - "All applicants must still complete the standard SSPTI recruitment process before joining."

    recruitment_process:
      description: "All applicants — whether joining SSPTI or Suspect University — must complete this process."
      steps:
        - "Go to the corp auth and sign in with your EVE Online account: https://auth.suspectsquadron.co.uk/dashboard/"
        - "Go to Character Audit on the left and add all your characters via the Add Character button."
        - "Go to the Services tab and link your Discord account to the auth."
        - "DM a Recruiting Officer on Discord."
        - "Go through an interview with a Recruiting Officer."

    policies:
      - "Full corp authentication required: every character you own must be registered on both the corporation authentication page AND the alliance authentication page. No exceptions."
      - "Have Jabber set up and open while you are actively playing. If you have setup problems, check the corp Jabber guide. If problems persist, DM any @Recruiting Officer."
      - "Have Mumble set up and use it whenever you join a fleet. If you have setup problems, check the corp Mumble guide. If problems persist, DM any @Recruiting Officer."
      - "Complete at least 5 strategic PAPs per month. Aim to fly main DPS ships in doctrine. This is per player, not per character — 10 characters still means 3 strategic PAPs minimum. Check your PAPs on the alliance PAP tracker. Topping the alliance PAP rankings earns corp tax reductions for all members!"
      - "Explore alliance SIGs — Goonswarm has great special interest groups covering a wide range of activities."
      - "For fleet doctrines and SRP eligibility, refer to the Goonswarm Federation doctrine forum: https://goonfleet.com/index.php/forum/266-fleet-doctrines-and-reimbursement/"
