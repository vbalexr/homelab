---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: aa-sspti
  namespace: flux-system
spec:
  image: ghcr.io/vbalexr/aa-sspti
  interval: 5m0s
  secretRef:
    name: ghcr-pull-sspti
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: aa-sspti
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: aa-sspti
  filterTags:
    pattern: '^\d{8}-\d{4}$'
  policy:
    alphabetical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: aa-sspti-nginx
  namespace: flux-system
spec:
  image: ghcr.io/vbalexr/aa-sspti-nginx
  interval: 5m0s
  secretRef:
    name: ghcr-pull-sspti
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: aa-sspti-nginx
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: aa-sspti-nginx
  filterTags:
    pattern: '^\d{8}-\d{4}$'
  policy:
    alphabetical:
      order: asc
