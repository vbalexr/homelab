apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: esphome
  namespace: home
spec:
  parentRefs:
    - name: home-gateway
      sectionName: https
  hostnames:
    - esphome.vbalex.com
  rules:
    - backendRefs:
        - name: esphome
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: esphome-redirect
  namespace: home
spec:
  parentRefs:
    - name: home-gateway
      sectionName: http
  hostnames:
    - esphome.vbalex.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
