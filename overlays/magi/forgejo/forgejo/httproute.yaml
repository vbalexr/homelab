apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: forgejo
spec:
  parentRefs:
    - name: forgejo-gateway
      sectionName: https
  hostnames:
    - git.vbalex.com
  rules:
    - backendRefs:
        - name: forgejo-http
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo-redirect
  namespace: forgejo
spec:
  parentRefs:
    - name: forgejo-gateway
      sectionName: http
  hostnames:
    - git.vbalex.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
