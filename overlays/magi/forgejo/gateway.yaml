# Entry point of Forgejo: web (80 redirects, 443 TLS) and Git over SSH (22) on one fixed LoadBalancer address. The Cilium
# controller creates the Service and the address is advertised to the routers over BGP, so only networks the firewall lets
# reach it can use Forgejo. external-dns publishes git.vbalex.com from the HTTPRoute; SSH uses the same name and IP.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: forgejo-gateway
  namespace: forgejo
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "10.1.1.17,fd7a:2201:1ac::17"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: forgejo-gateway-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: ssh
      protocol: TCP
      port: 22
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: Same
