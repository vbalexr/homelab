apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-job-controller
  namespace: forgejo-runners
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-job-controller
  namespace: forgejo-runners
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-job-controller
  namespace: forgejo-runners
subjects:
  - kind: ServiceAccount
    name: forgejo-job-controller
    namespace: forgejo-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgejo-job-controller
