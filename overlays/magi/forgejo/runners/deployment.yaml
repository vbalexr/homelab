# One replica and Recreate: two controllers would start every job twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-job-controller
  namespace: forgejo-runners
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo-job-controller
  template:
    metadata:
      labels:
        app: forgejo-job-controller
    spec:
      serviceAccountName: forgejo-job-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/vbalexr/forgejo-job-controller
          envFrom:
            - configMapRef:
                name: forgejo-job-controller
          env:
            - name: FORGEJO_TOKEN_FILE
              value: /secrets/token
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          # Liveness only checks that the process answers. /healthz depends on Forgejo being reachable, and restarting
          # the controller does not fix a Forgejo outage.
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: token
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: token
          secret:
            secretName: forgejo-controller-token
