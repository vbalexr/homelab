---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: postgres
  namespace: flux-system
spec:
  image: ghcr.io/vbalexr/postgres
  interval: 5m0s
  secretRef:
    name: ghcr-pull-postgres
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: postgres
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: postgres
  filterTags:
    pattern: '^([0-9]{8}\.[0-9]{4})$'
    extract: "$1"
  policy:
    alphabetical:
      order: asc
