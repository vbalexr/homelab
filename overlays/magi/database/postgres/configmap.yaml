apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: database
data:
  postgresql.conf: |
    # Tuning for vchord and pgvector
    shared_preload_libraries = 'vector,vchord'
    max_connections = 200
    shared_buffers = 256MB
    effective_cache_size = 1GB
    maintenance_work_mem = 64MB
    checkpoint_completion_target = 0.9
    wal_buffers = 16MB
  00-include-conf.sh: |
    #!/bin/sh
    # The stock postgresql.conf does not read /etc/postgresql/conf.d on its own
    echo "include_dir = '/etc/postgresql/conf.d'" >> "$PGDATA/postgresql.conf"
  01-init-extensions.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS vchord;
