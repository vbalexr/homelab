# Plain HTTP (8080, Service port 80) redirects to HTTPS (8443, Service port 443).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    return 301 https://minecraft.vbalex.com$request_uri;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name minecraft.vbalex.com;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
