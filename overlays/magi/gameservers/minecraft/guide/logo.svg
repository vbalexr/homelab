<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
          <defs>
            <!-- Sky Gradient -->
            <linearGradient id="mcSkyGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#38BDF8"/>
              <stop offset="65%" stop-color="#0EA5E9"/>
              <stop offset="100%" stop-color="#0284C7"/>
            </linearGradient>

            <!-- Mountain Emerald/Grass Gradients -->
            <linearGradient id="mcMountainLight" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#4ADE80"/>
              <stop offset="100%" stop-color="#22C55E"/>
            </linearGradient>
            <linearGradient id="mcMountainMid" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#22C55E"/>
              <stop offset="100%" stop-color="#16A34A"/>
            </linearGradient>
            <linearGradient id="mcMountainDark" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#15803D"/>
              <stop offset="100%" stop-color="#14532D"/>
            </linearGradient>

            <!-- Rounded Squircle Icon Clip Path -->
            <clipPath id="iconSquircleClip">
              <rect x="0" y="0" width="512" height="512" rx="96" ry="96"/>
            </clipPath>
          </defs>

          <!-- Clipped Icon Badge Group -->
          <g clip-path="url(#iconSquircleClip)">
            <!-- 1. Vibrant Sky Background -->
            <rect x="0" y="0" width="512" height="512" fill="url(#mcSkyGrad)"/>

            <!-- Subtle Pixel-Grid Atmosphere Accent in Upper Sky -->
            <rect x="0" y="0" width="512" height="110" fill="#7DD3FC" opacity="0.22"/>

            <!-- 2. Blocky Minecraft-Style Clouds -->
            <!-- Top-Left Cloud -->
            <g id="cloudLeft">
              <!-- Cloud Shadow Base -->
              <rect x="44" y="96" width="144" height="32" rx="4" fill="#BAE6FD"/>
              <rect x="72" y="72" width="84" height="32" rx="4" fill="#BAE6FD"/>
              <!-- Cloud Bright Top -->
              <rect x="44" y="88" width="144" height="28" rx="4" fill="#FFFFFF"/>
              <rect x="72" y="64" width="84" height="32" rx="4" fill="#FFFFFF"/>
            </g>

            <!-- Top-Right Cloud -->
            <g id="cloudRight">
              <!-- Cloud Shadow Base -->
              <rect x="288" y="128" width="176" height="36" rx="4" fill="#BAE6FD"/>
              <rect x="324" y="100" width="104" height="36" rx="4" fill="#BAE6FD"/>
              <!-- Cloud Bright Top -->
              <rect x="288" y="120" width="176" height="32" rx="4" fill="#FFFFFF"/>
              <rect x="324" y="92" width="104" height="36" rx="4" fill="#FFFFFF"/>
            </g>

            <!-- Small Distant Center Cloud -->
            <g id="cloudCenter">
              <rect x="212" y="68" width="68" height="18" rx="3" fill="#E0F2FE" opacity="0.9"/>
              <rect x="226" y="56" width="40" height="16" rx="3" fill="#FFFFFF" opacity="0.95"/>
            </g>

            <!-- 3. Green Mountain Range in the Background -->
            <g id="greenMountain">
              <!-- Secondary Left Ridge -->
              <polygon points="-20,512 -20,310 110,205 230,320 230,512" fill="#15803D"/>
              <polygon points="-20,310 110,205 110,335 -20,375" fill="#22C55E"/>

              <!-- Main Tall Peak (Center-Right) -->
              <!-- Left Lit Slope -->
              <polygon points="105,512 325,152 325,512" fill="url(#mcMountainLight)"/>
              <!-- Right Shaded Slope -->
              <polygon points="325,152 532,375 532,512 325,512" fill="url(#mcMountainDark)"/>

              <!-- Blocky Minecraft Terraced Grass Steps on Main Peak -->
              <polygon points="270,242 325,152 380,211 356,232 325,214 294,252" fill="#86EFAC"/>
              <!-- Mid-Mountain Blocky Cliff Facets -->
              <polygon points="185,380 255,266 295,295 245,395" fill="#16A34A"/>
              <polygon points="325,245 415,310 385,365 325,330" fill="#166534"/>

              <!-- Foreground Rolling Green Hills (Right Side) -->
              <polygon points="220,512 220,395 360,340 520,405 520,512" fill="url(#mcMountainMid)"/>
              <polygon points="360,340 520,405 520,512 360,512" fill="#15803D"/>
              <!-- Crisp Blocky Grass Top Trim -->
              <polygon points="220,395 360,340 360,358 220,412" fill="#4ADE80"/>
            </g>

            <!-- 4. Blocky Geometric Minecraft Wolf Head (Bottom-Left Foreground) -->
            <g id="minecraftWolf">
              <!-- Drop Shadow Silhouette against Mountain -->
              <polygon points="32,512 32,276 52,276 52,208 108,208 122,256 176,256 190,208 246,208 246,276 266,276 266,356 322,356 322,448 256,448 256,512" fill="#0F172A" opacity="0.28" transform="translate(10, 10)"/>

              <!-- Left Ear -->
              <rect x="44" y="200" width="60" height="68" rx="4" fill="#CBD5E1"/>
              <rect x="44" y="200" width="46" height="68" rx="4" fill="#F1F5F9"/>
              <!-- Left Inner Ear -->
              <rect x="58" y="216" width="24" height="38" rx="2" fill="#64748B"/>

              <!-- Right Ear -->
              <rect x="184" y="200" width="60" height="68" rx="4" fill="#94A3B8"/>
              <rect x="184" y="200" width="44" height="68" rx="4" fill="#E2E8F0"/>
              <!-- Right Inner Ear -->
              <rect x="196" y="216" width="24" height="38" rx="2" fill="#475569"/>

              <!-- Main Head Block -->
              <rect x="28" y="264" width="232" height="200" rx="10" fill="#E2E8F0"/>
              <!-- Left/Top Fur Highlight Plane -->
              <polygon points="28,274 218,264 218,454 28,454" fill="#F8FAFC"/>
              <!-- Right Cheek Fur Shading -->
              <rect x="208" y="264" width="52" height="190" rx="6" fill="#CBD5E1"/>

              <!-- Forehead Dark Gray Fur Crest -->
              <polygon points="84,264 204,264 190,308 98,308" fill="#64748B"/>
              <rect x="116" y="304" width="56" height="22" fill="#94A3B8"/>

              <!-- Cheek Fur Tufts (Left & Right) -->
              <polygon points="28,372 14,394 28,414" fill="#F8FAFC"/>
              <polygon points="28,410 18,428 28,444" fill="#E2E8F0"/>

              <!-- Expressive Blocky Eyes -->
              <!-- Left Eye (from viewer's perspective) -->
              <rect x="64" y="328" width="44" height="26" rx="2" fill="#FFFFFF"/>
              <rect x="86" y="328" width="22" height="26" rx="2" fill="#0F172A"/>
              <!-- Eye Catchlight -->
              <rect x="90" y="332" width="6" height="6" fill="#FFFFFF"/>

              <!-- Right Eye -->
              <rect x="182" y="328" width="44" height="26" rx="2" fill="#FFFFFF"/>
              <rect x="182" y="328" width="22" height="26" rx="2" fill="#0F172A"/>
              <!-- Eye Catchlight -->
              <rect x="186" y="332" width="6" height="6" fill="#FFFFFF"/>

              <!-- Protruding 3D Blocky Wolf Snout / Muzzle -->
              <!-- Muzzle Top/Front Box -->
              <rect x="114" y="352" width="196" height="92" rx="8" fill="#CBD5E1"/>
              <rect x="114" y="352" width="182" height="78" rx="8" fill="#F1F5F9"/>
              <!-- Muzzle Lower Jaw Shadow -->
              <rect x="122" y="424" width="174" height="20" rx="4" fill="#94A3B8"/>
              <!-- Mouth Line -->
              <rect x="134" y="416" width="154" height="6" rx="2" fill="#334155"/>

              <!-- Nose Block -->
              <rect x="246" y="352" width="64" height="36" rx="6" fill="#0F172A"/>
              <!-- Nose Shine -->
              <rect x="254" y="358" width="22" height="8" rx="2" fill="#475569"/>

              <!-- Neck & Signature Tamed Minecraft Red Collar -->
              <rect x="44" y="454" width="204" height="58" fill="#CBD5E1"/>
              <rect x="44" y="454" width="174" height="58" fill="#E2E8F0"/>
              <!-- Red Collar Band -->
              <rect x="40" y="456" width="212" height="28" rx="4" fill="#EF4444"/>
              <rect x="204" y="456" width="48" height="28" rx="4" fill="#B91C1C"/>
              <!-- Collar Tag Buckle -->
              <rect x="174" y="454" width="22" height="32" rx="3" fill="#FACC15"/>
              <rect x="180" y="460" width="10" height="20" rx="1" fill="#CA8A04"/>
            </g>

            <!-- Crisp Inner Rim Highlight for Squircle Badge -->
            <rect x="3" y="3" width="506" height="506" rx="93" ry="93" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"/>
          </g>
        </svg>