apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - statefulset.yaml
  - service.yaml
  - certificate.yaml
# Player guide and client mod pack served by the "guide" sidecar. No name hash: the mounted volume picks up edits without restarting the server.
configMapGenerator:
  - name: minecraft-guide
    namespace: gameservers
    files:
      - guide/index.html
      - guide/logo.svg
      - guide/CoyoteDensPack-1.2.1.mrpack
    options:
      disableNameSuffixHash: true
  - name: minecraft-guide-nginx
    namespace: gameservers
    files:
      - default.conf=guide/nginx.conf
    options:
      disableNameSuffixHash: true
# Server icon shown in the multiplayer list (64x64 PNG), mounted over /data/server-icon.png. Stored as .png.bin because Flux's default ignore skips .png files. Name hash on: changing the icon restarts the pod, which reads it at start.
  - name: minecraft-icon
    namespace: gameservers
    files:
      - server-icon.png=icon/server-icon.png.bin
