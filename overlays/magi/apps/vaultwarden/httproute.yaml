apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden
  namespace: shared
spec:
  parentRefs:
    - name: magi
      namespace: gateway
      sectionName: vault-vbalex-com
  hostnames:
    - vault.vbalex.com
  rules:
    - backendRefs:
        - name: vaultwarden
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden-redirect
  namespace: shared
spec:
  parentRefs:
    - name: magi
      namespace: gateway
      sectionName: http
  hostnames:
    - vault.vbalex.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
