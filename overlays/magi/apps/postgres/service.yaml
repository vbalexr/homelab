apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: database
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: database
  annotations:
    lbipam.cilium.io/ips: "10.1.1.20,fd7a:2201:1ac::20"
spec:
  type: LoadBalancer
  ipFamilyPolicy: PreferDualStack
  externalTrafficPolicy: Local
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
