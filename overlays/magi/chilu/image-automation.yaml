---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: chilu-bb
  namespace: flux-system
spec:
  image: ghcr.io/thegamerytofficel-blip/buyback
  interval: 5m0s
  secretRef:
    name: ghcr-pull-chilu
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: chilu-bb
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: chilu-bb
  filterTags:
    pattern: '^\d{8}-\d{4}$'
  policy:
    alphabetical:
      order: asc
