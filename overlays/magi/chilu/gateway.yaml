# Entry point for the apps in this namespace. No hostname (and so no certificate) is known yet: HTTP only until one is assigned.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: chilu-gateway
  namespace: chilu
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "10.1.1.14,fd7a:2201:1ac::14"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
