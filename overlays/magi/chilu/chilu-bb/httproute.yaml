# No public hostname is known for chilu-bb (not in Caddy/cloudflared), so the route matches any host on the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chilu-bb
  namespace: chilu
spec:
  parentRefs:
    - name: chilu-gateway
      sectionName: http
  rules:
    - backendRefs:
        - name: chilu-bb
          port: 80
