# Shared entry point for HTTP(S) services; routes from any namespace attach to it. The Cilium controller creates the
# LoadBalancer Service, pinned to a fixed address from the pool (advertised to the routers over BGP). Each HTTPS listener
# gets its certificate from cert-manager (annotation below) into the Secret named by certificateRefs.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: magi
  namespace: gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "10.1.1.10,fd7a:2201:1ac::10"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https-test
      protocol: HTTPS
      port: 443
      hostname: gw-test.vbalex.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: gw-test-vbalex-com-tls
      allowedRoutes:
        namespaces:
          from: All
