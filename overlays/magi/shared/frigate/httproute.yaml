apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frigate
  namespace: shared
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: https
  hostnames:
    - cameras.vbalex.com
  rules:
    - backendRefs:
        - name: frigate
          port: 8971
      # live view and event streams are long-lived
      timeouts:
        request: 0s
        backendRequest: 0s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frigate-redirect
  namespace: shared
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: http
  hostnames:
    - cameras.vbalex.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
