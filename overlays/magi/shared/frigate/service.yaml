# Frigate runs outside the cluster (CCTV VLAN, 172.16.25.200). A Service without a selector plus a hand-written
# EndpointSlice lets the gateway route to it like to any other backend.
apiVersion: v1
kind: Service
metadata:
  name: frigate
  namespace: shared
spec:
  ipFamilies:
    - IPv4
  ports:
    - name: http
      port: 8971
      protocol: TCP
      targetPort: 8971
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: frigate
  namespace: shared
  labels:
    kubernetes.io/service-name: frigate
addressType: IPv4
ports:
  - name: http
    port: 8971
    protocol: TCP
endpoints:
  - addresses:
      - 172.16.25.200
