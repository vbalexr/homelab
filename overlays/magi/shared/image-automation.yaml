  namespace: flux-system
spec:
  image: ghcr.io/immich-app/immich-machine-learning
  interval: 5m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: immich-machine-learning
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: immich-machine-learning
  policy:
    semver:
      range: ">=3.0.0 <4.0.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: vaultwarden
  namespace: flux-system
spec:
  image: ghcr.io/dani-garcia/vaultwarden
  interval: 5m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
