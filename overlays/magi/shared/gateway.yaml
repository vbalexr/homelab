apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
spec:
  gatewayClassName: cilium
  infrastructure:
    labels:
      pool: public
  listeners:
    # Omit listener hostname so both vault.vbalex.com and photos.vbalex.com
    # routes can attach (hostname on listener intersects with route hostnames).
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: shared-gateway-tls
      allowedRoutes:
        namespaces:
          from: Same
