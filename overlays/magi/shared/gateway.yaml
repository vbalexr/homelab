# Entry point for the apps in this namespace (routes attach from the same namespace only). The Cilium controller creates the
# LoadBalancer Service, pinned to a fixed pool address that is advertised to the routers over BGP.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  namespace: shared
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "10.1.1.10,fd7a:2201:1ac::10"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: shared-gateway-tls
      allowedRoutes:
        namespaces:
          from: Same
