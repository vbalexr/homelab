apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: shared
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: immich-machine-learning
          image: ghcr.io/immich-app/immich-machine-learning
          ports:
            - name: http
              containerPort: 3003
          env:
            - name: IMMICH_LOG_LEVEL
              value: log
            - name: TZ
              value: UTC
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: MPLCONFIGDIR
              value: /cache/.config/matplotlib
            - name: XDG_CACHE_HOME
              value: /cache/.config
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: immich-ml-cache
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: shared
spec:
  selector:
    app: immich-machine-learning
  ports:
    - name: http
      port: 3003
      targetPort: http
