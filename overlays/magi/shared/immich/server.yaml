apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: shared
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v3.1.0
          ports:
            - name: http
              containerPort: 2283
          env:
            - name: IMMICH_PORT
              value: "2283"
            - name: IMMICH_LOG_LEVEL
              value: log
            - name: TZ
              value: UTC
            - name: DB_HOSTNAME
              value: postgres.database.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: shared_immich
            - name: DB_DATABASE_NAME
              value: shared_immich
            - name: REDIS_HOSTNAME
              value: valkey.database.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_DBINDEX
              value: "0"
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://immich-machine-learning:3003
          envFrom:
            - secretRef:
                name: immich-env
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: library
              mountPath: /data
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich-library
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: shared
spec:
  selector:
    app: immich-server
  ports:
    - name: http
      port: 2283
      targetPort: http
