# Point immich-server's /data at the single NFS-backed claim on the "ghost" NAS.
#
# Previously this mounted three Longhorn PVCs: immich-upload-data at /data with
# immich-upload-data-{alex,ana} nested inside it at /data/upload/<userId>. Those
# per-user directories now live inside the one share, so a single volume covers
# the whole media root and no nested mounts are needed.
#
# The base declares one volume named upload-data (an emptyDir placeholder)
# mounted at /data; these ops swap it for the claim. Paths are index-based, so
# do not reorder volumes in apps/immich/deployment-server.yaml.
- op: remove
  path: /spec/template/spec/volumes/0/emptyDir
- op: add
  path: /spec/template/spec/volumes/0/persistentVolumeClaim
  value:
    claimName: immich-media
