apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: shared
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: https
  hostnames:
    - photos.vbalex.com
  rules:
    - backendRefs:
        - name: immich-server
          port: 2283
      timeouts:
        request: 0s
        backendRequest: 0s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich-redirect
  namespace: shared
spec:
  parentRefs:
    - name: shared-gateway
      sectionName: http
  hostnames:
    - photos.vbalex.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
