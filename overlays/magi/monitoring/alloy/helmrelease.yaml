# Grafana Alloy as a DaemonSet — ships all pod logs to Loki.
# Promoted from kustomize helmCharts inflation to a Flux HelmRelease.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: flux-system
spec:
  interval: 30m
  releaseName: alloy
  targetNamespace: monitoring
  chart:
    spec:
      chart: alloy
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      version: 1.10.0
  values:
    controller:
      type: daemonset
    alloy:
      configMap:
        content: |
          // -----------------------------------------------------------------------
          // 1. Discover all pods in the cluster (all namespaces incl. kube-system).
          // -----------------------------------------------------------------------
          discovery.kubernetes "pods" {
            role = "pod"
          }

          // -----------------------------------------------------------------------
          // 2. Relabel: derive the log file path and structured metadata labels
          //    from the Kubernetes pod discovery targets.
          // -----------------------------------------------------------------------
          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            // Keep only running containers (avoids attaching to init/sidecar stubs).
            rule {
              source_labels = ["__meta_kubernetes_pod_phase"]
              regex         = "Pending|Running|Succeeded"
              action        = "keep"
            }

            // Map namespace to a label used by Loki queries.
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            // Map pod name.
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            // Map container name.
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            // Derive a short "app" label from the common well-known labels.
            rule {
              source_labels = [
                "__meta_kubernetes_pod_label_app_kubernetes_io_name",
                "__meta_kubernetes_pod_label_app",
              ]
              separator    = ""
              target_label = "app"
              regex        = "(.+)"
            }

            // Build the container log path on the node filesystem.
            rule {
              source_labels = [
                "__meta_kubernetes_pod_uid",
                "__meta_kubernetes_pod_container_name",
              ]
              separator    = "/"
              target_label = "__path__"
              replacement  = "/var/log/pods/*$1/*.log"
            }
          }

          // -----------------------------------------------------------------------
          // 3. Tail the discovered log files and forward to Loki.
          // -----------------------------------------------------------------------
          loki.source.kubernetes "pod_logs" {
            targets    = discovery.relabel.pod_logs.output
            forward_to = [loki.write.default.receiver]
          }

          // -----------------------------------------------------------------------
          // 4. Write collected log streams to the Loki push API (Service "loki":3100).
          // -----------------------------------------------------------------------
          loki.write "default" {
            endpoint {
              url = "http://loki:3100/loki/api/v1/push"
            }
          }
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
            patch: |-
              apiVersion: v1
              kind: Service
              metadata:
                name: dualstack
              spec:
                ipFamilyPolicy: PreferDualStack
                ipFamilies:
                  - IPv4
                  - IPv6
