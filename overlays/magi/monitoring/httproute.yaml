# admin.vbalex.com/grafana -> Grafana. Grafana serves itself under /grafana, so the prefix is kept.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  parentRefs:
    - name: admin-gateway
      namespace: admin
      sectionName: https
  hostnames:
    - admin.vbalex.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /grafana
      backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
