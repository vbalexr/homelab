apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No global `namespace:` transform — HelmRelease/HelmRepository objects live in
# flux-system while the workloads target `monitoring`. Every namespaced resource
# below carries its own explicit namespace.
resources:
  - namespace.yaml
  - helmrepositories.yaml
  - kube-prometheus-stack
  - loki
  - alloy
  - secret-grafana-admin.yaml
  - secret-alertmanager-discord.yaml
  - gateway.yaml
  - certificate.yaml
  - routes
  - alertmanagerconfig.yaml
  - ../../../apps/monitoring-dashboards
