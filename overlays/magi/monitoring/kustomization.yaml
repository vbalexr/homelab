apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - prometheus-stack.yaml
  - loki.yaml
  - alloy.yaml
  - routers.yaml
  - truenas.yaml
  - httproute.yaml
configMapGenerator:
  - name: dashboard-logs-explorer
    namespace: monitoring
    files:
      - logs-explorer.json=dashboards/logs-explorer.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  # Picked up by the Grafana sidecar (label below), which watches every namespace.
  - name: dashboard-homelab-overview
    namespace: monitoring
    files:
      - homelab-overview.json=dashboards/homelab-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
