# Every app serves /actuator/prometheus on its HTTP port; the Prometheus stack picks up PodMonitors from all namespaces.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: akaki-apps
  namespace: mrakaki
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: akaki-apps
  podMetricsEndpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
