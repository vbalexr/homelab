# The webapp is the only service the browser talks to; the others stay inside the namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webapp
  namespace: mrakaki
spec:
  parentRefs:
    - name: mrakaki-gateway
      sectionName: https
  hostnames:
    - mrakaki.com
  rules:
    - backendRefs:
        - name: webapp
          port: 8080
