apiVersion: apps/v1
kind: Deployment
metadata:
  name: safetravel
  namespace: mrakaki
  labels:
    app: safetravel
    app.kubernetes.io/part-of: akaki-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: safetravel
  template:
    metadata:
      labels:
        app: safetravel
        app.kubernetes.io/part-of: akaki-apps
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: forgejo-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: safetravel
          image: git.vbalex.com/mrakaki/safetravel
          env:
            - name: SAFETRAVEL_DB_URL
              value: "jdbc:postgresql://postgres.database.svc.cluster.local:5432/mrakaki?currentSchema=safetravel"
            - name: SAFETRAVEL_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mrakaki-db
                  key: DB_USER
            - name: SAFETRAVEL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mrakaki-db
                  key: DB_PASSWORD
            - name: ESI_WRAPPER_URL
              value: "http://esi-wrapper:8082"
            - name: UNIVERSE_URL
              value: "http://universe:8084"
            - name: S2S_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mrakaki-apps
                  key: S2S_TOKEN_SAFETRAVEL
            - name: S2S_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: mrakaki-apps
                  key: S2S_PUBLIC_KEY
            - name: ESI_USER_AGENT
              valueFrom:
                secretKeyRef:
                  name: mrakaki-apps
                  key: ESI_USER_AGENT
          ports:
            - name: http
              containerPort: 8088
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: safetravel
  namespace: mrakaki
  labels:
    app: safetravel
spec:
  selector:
    app: safetravel
  ports:
    - name: http
      port: 8088
      targetPort: http
