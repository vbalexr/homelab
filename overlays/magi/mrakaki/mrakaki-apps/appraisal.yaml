apiVersion: apps/v1
kind: Deployment
metadata:
  name: appraisal
  namespace: mrakaki
  labels:
    app: appraisal
    app.kubernetes.io/part-of: akaki-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appraisal
  template:
    metadata:
      labels:
        app: appraisal
        app.kubernetes.io/part-of: akaki-apps
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: forgejo-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: appraisal
          image: git.vbalex.com/mrakaki/appraisal
          env:
            - name: APPRAISAL_DB_URL
              value: "jdbc:postgresql://postgres.database.svc.cluster.local:5432/mrakaki?currentSchema=appraisal"
            - name: APPRAISAL_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mrakaki-db
                  key: DB_USER
            - name: APPRAISAL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mrakaki-db
                  key: DB_PASSWORD
            - name: MARKET_URL
              value: "http://market:8083"
            - name: UNIVERSE_URL
              value: "http://universe:8084"
            - name: S2S_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mrakaki-apps
                  key: S2S_TOKEN_APPRAISAL
            - name: S2S_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: mrakaki-apps
                  key: S2S_PUBLIC_KEY
          ports:
            - name: http
              containerPort: 8085
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: appraisal
  namespace: mrakaki
  labels:
    app: appraisal
spec:
  selector:
    app: appraisal
  ports:
    - name: http
      port: 8085
      targetPort: http
