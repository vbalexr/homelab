apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: akaki-auth
  namespace: flux-system
spec:
  image: git.vbalex.com/mrakaki/auth
  interval: 5m0s
  secretRef:
    name: forgejo-pull-mrakaki
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: akaki-auth
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: akaki-auth
  # Tags are yymmdd-HHMM, so the alphabetical order is the build order.
  filterTags:
    pattern: '^\d{6}-\d{4}$'
  policy:
    alphabetical:
      order: asc
---
