apiVersion: apps/v1
kind: Deployment
metadata:
  name: mrakaki-authentication
  namespace: mrakaki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mrakaki-authentication
  template:
    metadata:
      labels:
        app: mrakaki-authentication
    spec:
      containers:
        - name: mrakaki-authentication
          image: docker.io/mrakaki/dev-containers:mrakaki-eve-auth.0.0.1
          command:
            - bash
            - -c
            - |
              until curl -sf http://configuration:8888/actuator/health >/dev/null; do
                echo "waiting for config server..."; sleep 3
              done
              exec java -jar app.jar
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: production
            - name: SPRING_CONFIG_IMPORT
              value: "configserver:http://configuration:8888"
          ports:
            - containerPort: 8080
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: mrakaki-authentication
  namespace: mrakaki
spec:
  selector:
    app: mrakaki-authentication
  ports:
    - port: 8080
      targetPort: 8080
