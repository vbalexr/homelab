# The baked-in configuration uses the short host name "mariadb".
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: mrakaki
spec:
  type: ExternalName
  externalName: mariadb.database.svc.cluster.local
---
# The configuration of universe calls the authentication service as "authentication".
apiVersion: v1
kind: Service
metadata:
  name: authentication
  namespace: mrakaki
spec:
  selector:
    app: mrakaki-authentication
  ports:
    - port: 8080
      targetPort: 8080
