repos:
  # --------------------------------------------------------------------------
  # SOPS encryption enforcement
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: check-sops-encrypted
        name: Verify SOPS encryption on secret files
        description: >
          Blocks Kubernetes Secret YAML files whose data/stringData values
          are not encrypted with SOPS (i.e. missing ENC[...] markers).
        language: script
        entry: .hooks/check-sops-encrypted.py
        files: ^overlays/.*\.ya?ml$
        types: [yaml]

  # --------------------------------------------------------------------------
  # Secret / credential detection
  # --------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Detect secrets with Gitleaks
        description: Scans for hardcoded secrets, private keys, and credentials.

  # --------------------------------------------------------------------------
  # General file hygiene
  # --------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
        name: Detect private keys
        description: Blocks files that contain private key material (RSA, DSA, EC, etc.).
        exclude: ^\.gitleaks\.toml$
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]   # allow multi-document YAML (Kubernetes manifests)
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict

  # --------------------------------------------------------------------------
  # YAML style linting
  # --------------------------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
