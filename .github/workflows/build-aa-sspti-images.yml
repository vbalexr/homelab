name: Build aa-sspti Images

on:
  push:
    branches:
      - main
    paths:
      - "containers/aa-sspti/**"
      - ".github/workflows/build-aa-sspti-images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: vbalexr
  AA_DOCKER_TAG: registry.gitlab.com/allianceauth/allianceauth/auth:v4.13.1

jobs:
  build-app-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image_name:
          - aa-sspti-gunicorn
          - aa-sspti-beat
          - aa-sspti-worker
          - aa-sspti-worker_services

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: tags
        run: |
          echo "date_tag=$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image_name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: containers/aa-sspti
          file: containers/aa-sspti/custom.dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.date_tag }}
            ${{ steps.tags.outputs.image }}:latest
          build-args: |
            AA_DOCKER_TAG=${{ env.AA_DOCKER_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-nginx-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - build-app-images

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: tags
        run: |
          echo "date_tag=$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${{ env.OWNER }}/aa-sspti-nginx" >> "$GITHUB_OUTPUT"

      - name: Build and push nginx image
        uses: docker/build-push-action@v5
        with:
          context: containers/aa-sspti
          file: containers/aa-sspti/nginx.dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.date_tag }}
            ${{ steps.tags.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
