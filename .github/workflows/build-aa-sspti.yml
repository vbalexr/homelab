name: Build aa-sspti image

on:
  push:
    branches:
      - main
    paths:
      - "containers/aa-sspti/**"
      - ".github/workflows/build-aa-sspti.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/vbalexr/aa-sspti
  VERSION_TAG: 20261022-aa5.5.0-whatax-a4a60ae

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Date tag
        id: date
        run: echo "tag=$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v5
        with:
          context: containers/aa-sspti
          file: containers/aa-sspti/Containerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION_TAG }}
            ${{ env.IMAGE }}:${{ steps.date.outputs.tag }}
