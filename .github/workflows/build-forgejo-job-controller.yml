name: Build forgejo-job-controller Image

on:
  push:
    branches:
      - main
    paths:
      - "containers/forgejo-job-controller/**"
      - "!containers/forgejo-job-controller/**/*.md"
      - ".github/workflows/build-forgejo-job-controller.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: vbalexr
  IMAGE_NAME: forgejo-job-controller

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: containers/forgejo-job-controller
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: containers/forgejo-job-controller/go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    needs:
      - test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: tags
        run: |
          echo "date_tag=$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: containers/forgejo-job-controller
          file: containers/forgejo-job-controller/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.date_tag }}
            ${{ steps.tags.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
