apiVersion: v1
kind: Service
metadata:
  name: configuration
  labels:
    app: mrakaki-configuration
spec:
  type: ClusterIP
  selector:
    app: mrakaki-configuration
  ports:
    - name: http
      port: 8888
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mrakaki-configuration
  labels:
    app: mrakaki-configuration
spec:
  replicas: 0
  selector:
    matchLabels:
      app: mrakaki-configuration
  template:
    metadata:
      labels:
        app: mrakaki-configuration
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configuration
          image: mrakaki/dev-containers:mrakaki-eve-config.0.0.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 2022
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 2022
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config-tmpfs
              mountPath: /.config
      volumes:
        - name: config-tmpfs
          emptyDir:
            medium: Memory
