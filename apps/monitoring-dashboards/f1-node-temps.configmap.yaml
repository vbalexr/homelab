apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-f1-node-temps
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  f1-node-temps.json: |
    {
      "title": "F1 Node Temperatures",
      "uid": "f1-node-temps",
      "schemaVersion": 39,
      "version": 1,
      "tags": ["monitoring", "nodes", "temperature"],
      "timezone": "browser",
      "refresh": "1m",
      "time": {"from": "now-1h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "pluginId": "prometheus",
            "label": "Datasource",
            "hide": 0,
            "refresh": 1,
            "query": "prometheus",
            "current": {}
          },
          {
            "name": "chip",
            "type": "query",
            "label": "Chip",
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "query": "label_values(node_hwmon_temp_celsius{chip!~\".*nct6775.*\"}, chip)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {}
          },
          {
            "name": "sensor",
            "type": "query",
            "label": "Sensor",
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "query": "label_values(node_hwmon_temp_celsius{chip=~\"$chip\", chip!~\".*nct6775.*\"}, sensor)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {}
          },
          {
            "name": "topn",
            "type": "custom",
            "label": "Top N",
            "query": "5,10,15,20",
            "includeAll": false,
            "multi": false,
            "current": {"text": "10", "value": "10"},
            "options": [
              {"text": "5", "value": "5"},
              {"text": "10", "value": "10", "selected": true},
              {"text": "15", "value": "15"},
              {"text": "20", "value": "20"}
            ]
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Node Hardware Temperatures",
          "description": "Reports node_hwmon_temp_celsius from node-exporter. NOTE (R1): this panel only populates if Talos exposes hwmon/coretemp sensors. Verify after metrics begin flowing — if no data appears, hwmon access may need to be enabled in the Talos machine config.",
          "gridPos": {"x": 0, "y": 0, "w": 24, "h": 12},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "node_hwmon_temp_celsius{chip=~\"$chip\", chip!~\".*nct6775.*\", sensor=~\"$sensor\"}",
              "legendFormat": "{{instance}} / {{chip}} / {{sensor}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "color": {"mode": "palette-classic"},
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 60},
                  {"color": "red", "value": 80}
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "tooltip": {"mode": "multi"},
            "legend": {"displayMode": "list", "placement": "bottom"}
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Max Temperature Right Now",
          "description": "Hottest exposed hwmon sensor and its current temperature. (R1 caveat: only populated if Talos exposes hwmon.)",
          "gridPos": {"x": 0, "y": 12, "w": 8, "h": 4},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "topk(1, node_hwmon_temp_celsius{chip=~\"$chip\", chip!~\".*nct6775.*\", sensor=~\"$sensor\"})",
              "instant": true,
              "legendFormat": "{{instance}} / {{chip}} / {{sensor}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 60},
                  {"color": "red", "value": 80}
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": ""},
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "value_and_name"
          }
        },
        {
          "id": 3,
          "type": "table",
          "title": "Top $topn Hottest Sensors",
          "description": "Ranks the currently exposed hwmon sensors by temperature, hottest first.",
          "gridPos": {"x": 8, "y": 12, "w": 16, "h": 12},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "${datasource}"},
              "expr": "topk($topn, node_hwmon_temp_celsius{chip=~\"$chip\", chip!~\".*nct6775.*\", sensor=~\"$sensor\"})",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {"Time": true, "job": true, "__name__": true, "endpoint": true, "namespace": true, "pod": true, "service": true, "container": true, "prometheus": true},
                "renameByName": {
                  "instance": "Node",
                  "chip": "Chip",
                  "sensor": "Sensor",
                  "Value": "Temp"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [{"field": "Temp", "desc": true}]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {"align": "auto", "filterable": true},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 60},
                  {"color": "red", "value": 80}
                ]
              }
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Temp"},
                "properties": [
                  {"id": "unit", "value": "celsius"},
                  {"id": "custom.cellOptions", "value": {"type": "color-background", "mode": "gradient"}},
                  {"id": "custom.width", "value": 120}
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [{"displayName": "Temp", "desc": true}]
          }
        }
      ]
    }
