apiVersion: v1
kind: Pod
metadata:
  name: gpu-transcode-benchmark
  namespace: default
spec:
  restartPolicy: Never
  nodeSelector:
    feature.node.kubernetes.io/intel-gpu.present: "true"
  containers:
    - name: ffmpeg
      image: docker.io/linuxserver/ffmpeg:latest
      command:
        - ffmpeg
        - -vaapi_device
        - /dev/dri/renderD128
        - -f
        - lavfi
        - -i
        - testsrc=duration=30:size=1920x1080:rate=30
        - -vf
        - format=nv12,hwupload
        - -c:v
        - h264_vaapi
        - -b:v
        - 4M
        - -f
        - "null"
        - /dev/null
      resources:
        limits:
          gpu.intel.com/i915: "1"
