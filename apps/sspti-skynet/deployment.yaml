apiVersion: apps/v1
kind: Deployment
metadata:
  name: sspti-skynet
  labels:
    app: sspti-skynet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sspti-skynet
  template:
    metadata:
      labels:
        app: sspti-skynet
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: corp-config
          configMap:
            name: sspti-skynet-env
            items:
              - key: corp.yaml
                path: corp.yaml
        - name: venv
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      containers:
        - name: sspti-skynet
          image: ghcr.io/mrakaki/sspti-skynet:latest
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: corp-config
              mountPath: /app/corp.yaml
              subPath: corp.yaml
              readOnly: true
            - name: venv
              mountPath: /app/.venv
            - name: tmp
              mountPath: /tmp
          env:
            - name: CORP_DOC_PATH
              value: "/app/corp.yaml"
            - name: UV_CACHE_DIR
              value: "/tmp/.cache/uv"
            - name: XDG_CACHE_HOME
              value: "/tmp/.cache"
          envFrom:
            - configMapRef:
                name: sspti-skynet-env
            - secretRef:
                name: sspti-skynet-secret
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
