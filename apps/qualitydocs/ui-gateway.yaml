apiVersion: v1
kind: Service
metadata:
  name: ui-gateway
  labels:
    app: ui-gateway
spec:
  type: ClusterIP
  selector:
    app: ui-gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-gateway
  labels:
    app: ui-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui-gateway
  template:
    metadata:
      labels:
        app: ui-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui-gateway
          image: ghcr.io/vbalexr/qualitydocs-ui-gateway:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: SERVICE_NAME
              value: ui-gateway
            - name: AUTH_SERVICE_URL
              value: http://auth-service:3001
            - name: PROCESS_SERVICE_URL
              value: http://process-service:3002
            - name: INVENTORY_SERVICE_URL
              value: http://inventory-service:3003
            - name: PRODUCTION_SERVICE_URL
              value: http://production-service:3004
            - name: SEARCH_SERVICE_URL
              value: http://search-service:3005
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service:3006
          envFrom:
            - secretRef:
                name: qualitydocs-secret
          volumeMounts:
            - name: uploads-data
              mountPath: /app/services/ui-gateway/src/public/uploads
      volumes:
        - name: uploads-data
          persistentVolumeClaim:
            claimName: qualitydocs-ui-uploads
