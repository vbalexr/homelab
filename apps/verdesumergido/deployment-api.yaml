apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdesumergido-api
  labels:
    app: verdesumergido
    component: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: verdesumergido
      component: api
  template:
    metadata:
      labels:
        app: verdesumergido
        component: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Apply committed Drizzle migrations before the server starts. The schema
      # is never patched at boot, so this is the only path a migration reaches
      # the database. Seeding (admin user + lookup data) is done manually once.
      initContainers:
        - name: migrate
          image: ghcr.io/vbalexr/verdesumergido-api:latest
          imagePullPolicy: IfNotPresent
          command: ["bun", "run", "db:migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: verdesumergido-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      containers:
        - name: api
          image: ghcr.io/vbalexr/verdesumergido-api:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          envFrom:
            - secretRef:
                name: verdesumergido-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
