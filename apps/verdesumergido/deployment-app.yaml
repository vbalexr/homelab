apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdesumergido-app
  labels:
    app: verdesumergido
    component: app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: verdesumergido
      component: app
  template:
    metadata:
      labels:
        app: verdesumergido
        component: app
    spec:
      # No non-root pod securityContext here: the stock nginx:alpine image binds
      # :80 and manages its own worker users as root, exactly as the app
      # Dockerfile ships it. The API carries the hardened profile instead.
      containers:
        - name: app
          image: ghcr.io/vbalexr/verdesumergido-app:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            # nginx proxies /api to the API service (app/nginx.conf.template).
            - name: API_URL
              value: http://verdesumergido-api:3001
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
