apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-config
  labels:
    app: immich
data:
  # Server Configuration
  # Also read by the machine-learning container, which overrides its own 3003
  # default -- keep in sync with the immich-machine-learning Service targetPort.
  IMMICH_PORT: "2283"
  IMMICH_LOG_LEVEL: "log"

  # Database Configuration (sourced from secret in overlay)
  # DB_HOSTNAME: from secret
  # DB_PORT: from secret
  # DB_USERNAME: from secret
  # DB_PASSWORD: from secret
  # DB_DATABASE_NAME: from secret

  # Redis Configuration (sourced from secret in overlay)
  # REDIS_HOSTNAME: from secret
  # REDIS_PORT: from secret
  # REDIS_PASSWORD: from secret
  # REDIS_DBINDEX: from secret

  # Machine Learning
  # Model name, enablement, URL and timeouts are no longer environment-driven;
  # they live in the admin UI (system config, stored in the database).

  # Server timezone
  TZ: "UTC"
