apiVersion: v1
kind: Service
metadata:
  name: aa-sspti-gunicorn
  labels:
    app: aa-sspti-gunicorn
spec:
  type: ClusterIP
  selector:
    app: aa-sspti-gunicorn
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aa-sspti-gunicorn
  labels:
    app: aa-sspti-gunicorn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aa-sspti-gunicorn
  template:
    metadata:
      labels:
        app: aa-sspti-gunicorn
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-config
          image: ghcr.io/vbalexr/aa-sspti:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 61000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/sh", "-c"]
          args:
            - |
              [ -f /config/local.py ] || cp /home/allianceauth/myauth/myauth/settings/local.py /config/local.py
              [ -f /config/celery.py ] || cp /home/allianceauth/myauth/myauth/celery.py /config/celery.py
              [ -f /config/urls.py ] || cp /home/allianceauth/myauth/myauth/urls.py /config/urls.py
              [ -f /config/memory_check.sh ] || (cp /memory_check.sh /config/memory_check.sh && chmod 0755 /config/memory_check.sh)
          volumeMounts:
            - name: app-config
              mountPath: /config
        - name: migrate
          image: ghcr.io/vbalexr/aa-sspti:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 61000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["python", "manage.py", "migrate", "--noinput"]
          workingDir: /home/allianceauth/myauth/
          envFrom:
            - secretRef:
                name: aa-sspti-secret
            - configMapRef:
                name: aa-sspti-env
          volumeMounts:
            - name: app-config
              mountPath: /home/allianceauth/myauth/myauth/settings/local.py
              subPath: local.py
            - name: app-config
              mountPath: /home/allianceauth/myauth/myauth/celery.py
              subPath: celery.py
            - name: app-config
              mountPath: /home/allianceauth/myauth/myauth/urls.py
              subPath: urls.py
      containers:
        - name: aa-sspti-gunicorn
          image: ghcr.io/vbalexr/aa-sspti:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 61000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - gunicorn
            - myauth.wsgi
            - --bind=0.0.0.0:8000
            - --workers=3
            - --timeout=120
            - --max-requests=500
            - --max-requests-jitter=50
          workingDir: /home/allianceauth/myauth/
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: aa-sspti-secret
            - configMapRef:
                name: aa-sspti-env
          volumeMounts:
            - name: app-config
              mountPath: /home/allianceauth/myauth/myauth/settings/local.py
              subPath: local.py
            - name: app-config
              mountPath: /home/allianceauth/myauth/myauth/celery.py
              subPath: celery.py
            - name: app-config
              mountPath: /home/allianceauth/myauth/myauth/urls.py
              subPath: urls.py
            - name: app-config
              mountPath: /memory_check.sh
              subPath: memory_check.sh
            - name: static-volume
              mountPath: /var/www/myauth/static
      volumes:
        - name: app-config
          persistentVolumeClaim:
            claimName: aa-sspti-config
        - name: static-volume
          persistentVolumeClaim:
            claimName: aa-sspti-static
